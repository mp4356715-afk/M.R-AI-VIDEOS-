<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI VIDEO 804</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
  body { background: #0a0a0f; color: white; min-height: 100vh; }
  .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #000; }
  .logo { font-size: 22px; font-weight: bold; color: #00d4ff; }
  .login-btn { padding: 8px 20px; border: 1px solid #00d4ff; background: transparent; color: #00d4ff; border-radius: 8px; cursor: pointer; }
  .container { max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
  h1 { font-size: 36px; margin-bottom: 10px; }
  h1 span { color: #00d4ff; }
  .subtitle { color: #aaa; margin-bottom: 30px; }
  .box { background: #1a1a24; padding: 25px; border-radius: 15px; border: 1px solid #2a2a3a; }
  textarea { width: 100%; height: 120px; background: #0a0a0f; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; font-size: 16px; margin-bottom: 15px; }
  .options { display: flex; gap: 10px; margin-bottom: 15px; }
  select { flex: 1; padding: 10px; background: #0a0a0f; border: 1px solid #333; color: white; border-radius: 8px; }
  .generate-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #00d4ff, #0066ff); border: none; color: white; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .credits { color: #00ff88; margin-top: 10px; font-weight: bold; }
  .info { color: #aaa; font-size: 14px; margin-top: 10px; }
  #result { margin-top: 20px; }
  video, img { width: 100%; border-radius: 10px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="navbar">
    <div class="logo">🤖 AI VIDEO 804</div>
    <button class="login-btn">Login</button>
