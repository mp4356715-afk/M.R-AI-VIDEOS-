<script>
async function generate(){

  let userPrompt =
    document.getElementById("prompt").value.trim();

  if(userPrompt === ""){
    alert("پہلے تصویر کے بارے میں کچھ لکھو");
    return;
  }

  document.getElementById("loading").style.display = "block";
  document.getElementById("result").innerHTML = "";

  let p = userPrompt.toLowerCase();

  let finalPrompt = "";

  /* 🇵🇰 Pakistan Flag */
  if(
    p.includes("pakistan flag") ||
    p.includes("pakistani flag") ||
    p.includes("پاکستان کا جھنڈا") ||
    p.includes("پاکستانی جھنڈا")
  ){

    finalPrompt =
    "A single official Pakistan national flag only. " +
    "The flag has a dark green field, a white vertical stripe along the hoist side, " +
    "a white crescent moon and a five-pointed white star in the green field. " +
    "The complete flag is clearly visible, waving naturally in the wind. " +
    "Realistic cloth texture, accurate official flag design, " +
    "no people, no woman, no man, no face, no animals, no buildings, " +
    "no text, no other flags, only the Pakistan national flag.";

  }

  /* 🇮🇳 India Flag */
  else if(
    p.includes("india flag") ||
    p.includes("indian flag") ||
    p.includes("بھارت کا جھنڈا") ||
    p.includes("انڈیا کا جھنڈا")
  ){

    finalPrompt =
    "A single official Indian national flag only. " +
    "Three horizontal bands: saffron on top, white in the middle, " +
    "green on the bottom, with a navy blue Ashoka Chakra with 24 spokes " +
    "in the exact center of the white band. " +
    "The complete flag is clearly visible, waving naturally in the wind. " +
    "Realistic cloth texture, accurate official Indian flag design, " +
    "no people, no woman, no man, no face, no animals, no buildings, " +
    "no text, no other flags, only the Indian national flag.";

  }

  /* 🌎 Any other image */
  else{

    finalPrompt =
    "Create exactly the image described by the user. " +
    "Do not replace the requested subject with something else. " +
    "Do not add unrelated people, objects or characters. " +
    "Follow the user's description carefully. " +
    "High quality, detailed, realistic image unless another style is requested. " +
    "User request: " + userPrompt;

  }


  let url =
    "https://image.pollinations.ai/prompt/" +
    encodeURIComponent(finalPrompt) +
    "?width=1024&height=1024&seed=" +
    Math.floor(Math.random() * 999999999);


  let img = new Image();

  img.onload = function(){

    document.getElementById("loading").style.display = "none";

    document.getElementById("result").innerHTML = "";

    img.style.maxWidth = "90%";
    img.style.borderRadius = "12px";
    img.style.border = "3px solid #00ff88";

    document.getElementById("result").appendChild(img);

    let br = document.createElement("br");
    document.getElementById("result").appendChild(br);

    let download = document.createElement("a");

    download.href = url;
    download.download = "AI-VIDEO-804-Image.png";
    download.className = "btn";
    download.innerText = "📥 Download Image";

    document.getElementById("result").appendChild(download);
  };


  img.onerror = function(){

    document.getElementById("loading").style.display = "none";

    document.getElementById("result").innerHTML =
      "<p style='color:red;font-size:18px'>" +
      "❌ تصویر بنانے میں مسئلہ آیا۔ دوبارہ کوشش کریں۔" +
      "</p>";

  };


  img.src = url;
}
</script>
