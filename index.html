<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI VIDEO 804</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_ID" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05050a;color:#fff;font-family:Arial;padding:10px;text-align:center}
.logo{font-size:26px;font-weight:bold;color:#00d4ff;margin:15px 0}
h1{font-size:28px} h1 span{color:#00d4ff}
.urdu{margin:10px 0 20px;font-size:16px}
.ad-box{max-width:728px;margin:15px auto;min-height:90px;background:#0a0a14;border-radius:10px;padding:10px}
.container{max-width:700px;margin:20px auto;background:#111122;padding:25px;border-radius:20px;border:1px solid #222}
textarea{width:100%;height:120px;background:#0a0a14;border:1px solid #333;color:#fff;padding:15px;border-radius:10px;font-size:16px;margin-bottom:15px}
button{width:100%;padding:16px;background:linear-gradient(90deg,#00c8ff,#0066ff);border:none;color:#fff;font-size:18px;font-weight:bold;border-radius:12px;cursor:pointer}
#result{margin-top:15px}
#result video{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="logo">🤖 AI VIDEO 804</div>
<h1>Create <span>Any AI Video</span> From Text</h1>
<p class="urdu">کارٹون، ریال، اینیمی - جو بھی لکھو گے وی ویڈیو بنے گی</p>

<!-- Ad Top -->
<div class="ad-box">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-YOUR_ID" data-ad-slot="111" data-ad-format="auto"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="container">
  <textarea id="prompt" placeholder="مثال: Pakistan flag waving"></textarea>
  <button onclick="makeVideo()">🚀 Generate Video</button>
  <div id="result"><p style="margin-top:10px;color:#888">ویڈیو یہاں بنے گی</p></div>
</div>

<!-- Ad Bottom -->
<div class="ad-box">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-YOUR_ID" data-ad-slot="222" data-ad-format="auto"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<script>
async function makeVideo(){
  let p = document.getElementById('prompt').value;
  if(p==""){alert("پہلے پرامپٹ لکھیں"); return;}
  
  document.getElementById('result').innerHTML = "⏳ ویڈیو بن رہی ہے... 40 سیکنڈ لگیں گے";
  
  // Pollinations - فری API بغیر Key کے
  let url = `https://pollinations.ai/video/` + encodeURIComponent(p);
  
  document.getElementById('result').innerHTML = `
    <p style="color:#00ff88">✅ ویڈیو تیار ہے!</p>
    <video controls autoplay src="${url}"></video>
    <a href="${url}" download style="color:#00d4ff">📥 Download Video</a>
  `;
}
</script>
</body>
</html>
