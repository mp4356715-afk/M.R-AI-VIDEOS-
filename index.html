<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI VIDEO 804 - AI Image Generator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#070b18;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}

h1{
  color:#00d9ff;
  font-size:32px;
  margin-bottom:8px;
}

.subtitle{
  color:#b9c3d6;
  font-size:16px;
  margin-bottom:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

textarea{
  width:100%;
  height:130px;
  background:#11182b;
  color:white;
  border:2px solid #00d9ff;
  border-radius:14px;
  padding:15px;
  font-size:17px;
  outline:none;
  resize:vertical;
}

textarea:focus{
  border-color:#00ff88;
}

.btn{
  width:100%;
  border:none;
  padding:16px;
  margin-top:15px;
  border-radius:14px;
  background:linear-gradient(90deg,#00d9ff,#0077ff);
  color:white;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{
  opacity:.9;
}

#loading{
  display:none;
  color:#00ff88;
  font-size:18px;
  margin-top:20px;
}

#result{
  margin-top:20px;
}

#result img{
  width:100%;
  max-width:600px;
  border-radius:15px;
  border:3px solid #00ff88;
  display:block;
  margin:20px auto;
}

.download{
  display:inline-block;
  text-decoration:none;
  text-align:center;
}

.examples{
  margin-top:25px;
  background:#10172a;
  padding:15px;
  border-radius:14px;
  color:#c8d1e3;
}

.example{
  background:#18223a;
  padding:10px;
  margin:7px 0;
  border-radius:8px;
  cursor:pointer;
}

.example:hover{
  background:#22304e;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 AI VIDEO 804</h1>

<p class="subtitle">
AI Image Generator — جو چاہو لکھو، تصویر بناؤ
</p>

<textarea
id="prompt"
placeholder="مثال: A beautiful Pakistani village at sunset, realistic photography..."
></textarea>

<button class="btn" onclick="generateImage()">
🚀 Generate Image
</button>

<p id="loading">
⏳ تصویر بن رہی ہے... براہ کرم انتظار کریں
</p>

<div id="result"></div>

<div class="examples">

<h3>🔥 Examples</h3>

<div class="example" onclick="useExample('Pakistan flag waving in the wind, realistic photography')">
🇵🇰 Pakistan Flag
</div>

<div class="example" onclick="useExample('India flag waving in the wind, realistic photography')">
🇮🇳 India Flag
</div>

<div class="example" onclick="useExample('A majestic lion standing in a jungle, cinematic realistic photography')">
🦁 Lion in Jungle
</div>

<div class="example" onclick="useExample('A futuristic sports car driving through a neon city at night, cinematic')">
🏎️ Futuristic Car
</div>

<div class="example" onclick="useExample('A beautiful Pakistani village surrounded by green fields at sunset')">
🌄 Pakistani Village
</div>

</div>

</div>

<script>

function useExample(text){

  document.getElementById("prompt").value = text;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


async function generateImage(){

  const userPrompt =
    document.getElementById("prompt").value.trim();

  if(userPrompt === ""){

    alert("پہلے تصویر کے بارے میں کچھ لکھیں");

    return;
  }

  const loading =
    document.getElementById("loading");

  const result =
    document.getElementById("result");

  loading.style.display = "block";

  result.innerHTML = "";

  /*
    User کی اصل request کو تبدیل نہیں کیا جا رہا۔
    صرف image model کو بہتر instructions دی جا رہی ہیں۔
  */

  let finalPrompt = `
Create an image exactly according to this user request:

"${userPrompt}"

Important instructions:
- Follow the user's requested subject accurately.
- Do not replace the requested subject with a person or unrelated object.
- If a specific flag is requested, show the correct national flag.
- If a specific animal is requested, show that animal.
- If a specific place is requested, show that place.
- Do not add unnecessary people unless requested.
- High quality detailed image.
- Realistic appearance unless the user requests another style.
`;

  /*
    Pollinations image API
  */

  const url =
    "https://image.pollinations.ai/prompt/"
    + encodeURIComponent(finalPrompt)
    + "?width=1024"
    + "&height=1024"
    + "&seed=" + Math.floor(Math.random()*999999999);

  const img = new Image();

  img.onload = function(){

    loading.style.display = "none";

    result.innerHTML = "";

    result.appendChild(img);

    const br = document.createElement("br");

    result.appendChild(br);

    const download =
      document.createElement("a");

    download.href = url;

    download.download =
      "AI-VIDEO-804-Image.png";

    download.className =
      "btn download";

    download.innerText =
      "📥 Download Image";

    result.appendChild(download);

  };


  img.onerror = function(){

    loading.style.display = "none";

    result.innerHTML = `
      <p style="color:#ff5555;font-size:18px;">
      ❌ تصویر بنانے میں مسئلہ آگیا۔
      دوبارہ کوشش کریں۔
      </p>
    `;

  };


  img.src = url;

}

</script>

</body>
</html>
