<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI VIDEO 804</title>
<style>
body { background: #05050a; color: white; font-family: Arial; margin:0; padding:20px; text-align:center; }
.logo { color:#00d4ff; font-size:22px; font-weight:bold; margin-bottom:20px; }
h1 { font-size:30px; }
h1 span { color:#00d4ff; }
.box { background:#111122; padding:20px; border-radius:15px; max-width:600px; margin:20px auto; }
textarea { width:100%; height:100px; background:#0a0a14; border:1px solid #333; color:white; padding:10px; border-radius:8px; font-size:16px; }
button { width:100%; padding:15px; background:linear-gradient(90deg,#00c8ff,#0066ff); border:none; color:white; font-size:18px; font-weight:bold; border-radius:10px; margin-top:15px; cursor:pointer; }
video { width:100%; margin-top:20px; border-radius:10px; }
</style>
</head>
<body>

<div class="logo">🤖 AI VIDEO 804</div>
<h1>Create <span>Any AI Video</span><br>From Text</h1>
<p>کارٹون، ریال، اینیمے - جو بھی لکھو گے وہی ویڈیو بنے گی</p>

<div class="box">
  <textarea id="prompt" placeholder="یہاں لکھو: Pakistan flag waving">Pakistan flag waving</textarea>
  <button onclick="makeVideo()">🚀 Generate Video</button>
  <div id="result"></div>
</div>

<script>
async function makeVideo(){
  const prompt = document.getElementById('prompt').value;
  const result = document.getElementById('result');
  if(!prompt) return alert('پہلے کچھ لکھو');
  
  result.innerHTML = '⏳ 40 سیکنڈ ویٹ کرو...';
  document.querySelector('button').disabled = true;
  
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + ' video, cinematic, 4k')}.mp4?model=wan2.1&animate=true`;
  
  result.innerHTML = `<video src="${url}" controls autoplay loop></video>`;
  document.querySelector('button').disabled = false;
}
</script>

</body>
</html>
